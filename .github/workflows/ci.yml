name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - name: Sorting benchmark
        run: java -cp target/classes io.github.muhammedfidann06.dsa.Benchmark 200000
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco
