name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - name: Sorting benchmark
        run: java -cp target/classes io.github.muhammedfidann06.dsa.Benchmark 200000 | tee benchmark.txt
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco
      # Live-Seite: interaktive Demos + Javadoc + Testabdeckung + Benchmark
      - name: Javadoc
        run: mvn -B org.apache.maven.plugins:maven-javadoc-plugin:3.11.2:javadoc -Ddoclint=none -Dshow=public
      - name: Build site
        run: |
          mkdir -p public
          cp site/index.html public/
          cp -r target/site/jacoco public/coverage
          cp -r "$(find target -type d -name apidocs | head -n 1)" public/api
          cp benchmark.txt public/benchmark.txt
          ls public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
